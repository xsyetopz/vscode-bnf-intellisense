<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background: flat dark ink, matches galleryBanner color #0d1b2a -->
  <rect width="256" height="256" rx="48" ry="48" fill="#0d1b2a"/>

  <!-- Left angle bracket < : nonterminal (entity/type teal) -->
  <polyline points="88,70 36,128 88,186" fill="none" stroke="#4ec9b0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right angle bracket > : nonterminal (entity/type teal) -->
  <polyline points="168,70 220,128 168,186" fill="none" stroke="#4ec9b0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Slash / : alternation operator shared by all four notations (keyword/operator magenta) -->
  <line x1="143" y1="76" x2="113" y2="180" stroke="#c586c0" stroke-width="22" stroke-linecap="round"/>
</svg>
