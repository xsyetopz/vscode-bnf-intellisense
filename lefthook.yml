pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc}"
      run: bunx biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 --no-globs {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-push:
  jobs:
    - name: typecheck
      run: bun check
    - name: test
      run: bun test
    - name: build
      run: bun run build
