name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v1.2.3) to package and release
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Verify release tag
        run: |
          set -euo pipefail

          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Release tag must start with v: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

          if ! git check-ref-format --allow-onelevel "refs/tags/$RELEASE_TAG"; then
            echo "Release tag is not a valid Git ref: $RELEASE_TAG" >&2
            exit 1
          fi

          checked_out_commit="$(git rev-parse --verify HEAD)"
          tag_ref="refs/tags/$RELEASE_TAG"

          if git show-ref --verify --quiet "$tag_ref"; then
            tag_commit="$(git rev-list --max-count=1 "$tag_ref")"
            if [[ "$tag_commit" != "$checked_out_commit" ]]; then
              echo "Local release tag does not match checked out commit: $RELEASE_TAG" >&2
              exit 1
            fi
          fi

          if git ls-remote --exit-code --refs origin "$tag_ref" >/dev/null; then
            remote_probe="refs/release-check/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git fetch --no-tags origin "$tag_ref:$remote_probe"
            remote_tag_commit="$(git rev-list --max-count=1 "$remote_probe")"
            git update-ref -d "$remote_probe"
            if [[ "$remote_tag_commit" != "$checked_out_commit" ]]; then
              echo "Remote release tag does not match checked out commit: $RELEASE_TAG" >&2
              exit 1
            fi
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run biome:check

      - name: Lint Markdown
        run: bun run md:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Package extension
        run: bun run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vscode-bnf-intellisense-vsix
          path: "*.vsix"
          if-no-files-found: error

      - name: Ensure release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          checked_out_commit="$(git rev-parse --verify HEAD)"
          tag_ref="refs/tags/$RELEASE_TAG"

          verify_local_tag() {
            local tag_commit
            tag_commit="$(git rev-list --max-count=1 "$tag_ref")"
            if [[ "$tag_commit" != "$checked_out_commit" ]]; then
              echo "Local release tag does not match checked out commit: $RELEASE_TAG" >&2
              exit 1
            fi
          }

          remote_tag_commit() {
            if git ls-remote --exit-code --refs origin "$tag_ref" >/dev/null; then
              :
            else
              local status=$?
              if [[ "$status" -eq 2 ]]; then
                return 2
              fi
              return "$status"
            fi

            local remote_probe="refs/release-check/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git fetch --no-tags origin "$tag_ref:$remote_probe"
            git rev-list --max-count=1 "$remote_probe"
            git update-ref -d "$remote_probe"
          }

          verify_remote_tag() {
            local remote_commit="$1"
            if [[ "$remote_commit" != "$checked_out_commit" ]]; then
              echo "Remote release tag does not match checked out commit: $RELEASE_TAG" >&2
              exit 1
            fi
          }

          local_tag_exists=false
          if git show-ref --verify --quiet "$tag_ref"; then
            verify_local_tag
            local_tag_exists=true
          fi

          remote_tag_exists=false
          if remote_commit="$(remote_tag_commit)"; then
            verify_remote_tag "$remote_commit"
            remote_tag_exists=true
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo "Unable to determine whether remote release tag exists: $RELEASE_TAG" >&2
              exit "$status"
            fi
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$remote_tag_exists" != true ]]; then
              echo "Pushed release tag is missing remotely: $RELEASE_TAG" >&2
              exit 1
            fi
            echo "Verified pushed release tag; no tag creation attempted."
          elif [[ "$remote_tag_exists" != true ]]; then
            if [[ "$local_tag_exists" != true ]]; then
              git tag "$RELEASE_TAG" "$checked_out_commit"
            fi

            # actions/checkout persisted github.token for this authenticated push.
            if ! git push origin "$tag_ref"; then
              if remote_commit="$(remote_tag_commit)"; then
                verify_remote_tag "$remote_commit"
                echo "Release tag was created concurrently at the validated commit."
              else
                status=$?
                echo "Unable to safely create release tag: $RELEASE_TAG" >&2
                exit "$status"
              fi
            fi
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" ./*.vsix --generate-notes --verify-tag
